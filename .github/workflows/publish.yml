name: Publish

# Publishes to PyPI when a v* tag is pushed. The package version is derived
# from that tag by hatch-vcs, so tagging is what cuts a release.
#
# Authentication uses PyPI Trusted Publishing (OIDC), so no API token is stored
# in this repo.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_new: ${{ steps.version.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - run: uv sync

      - run: uv run ruff format --check .

      - run: uv run ruff check .

      - run: uv run mypy

      - run: uv run pytest

      - run: uv build

      - name: Validate distribution metadata
        run: uv run --with twine twine check dist/*

      - name: Read built version and check PyPI
        id: version
        run: |
          version=$(basename "$(ls dist/otel_metrics-*.whl | head -n1)" | cut -d- -f2)
          http_code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/otel-metrics/$version/json")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$http_code" = "200" ]; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::otel-metrics $version is already on PyPI -- skipping upload"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "::notice::otel-metrics $version is new -- will publish"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' || needs.build.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || inputs.target }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi')
                && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

      - name: Create GitHub release
        if: github.event_name == 'push' || inputs.target == 'pypi'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::GitHub release $tag already exists"
            exit 0
          fi
          gh release create "$tag" --title "$tag" --generate-notes --latest

  prepare-next-release:
    needs: [build, publish]
    if: >-
      needs.publish.result == 'success' &&
      (github.event_name == 'push' || inputs.target == 'pypi')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Bump release-version.txt and merge the prepare PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED: ${{ needs.build.outputs.version }}
        run: |
          current=$(tr -d '[:space:]' < release-version.txt)
          if [ "$current" != "$RELEASED" ]; then
            echo "::notice::release-version.txt is already $current after $RELEASED -- leaving it alone"
            exit 0
          fi

          IFS=. read -r major minor patch <<< "$RELEASED"
          next="$major.$minor.$((patch + 1))"
          branch="chore/prepare-v$next"

          if [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" = "0" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            printf '%s\n' "$next" > release-version.txt
            git add release-version.txt
            git commit -m "Prepare release $next"
            git push --force origin "$branch"

            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "Prepare release $next" \
              --body "Automated bump of \`release-version.txt\` after publishing $RELEASED. The next change merged to \`main\` publishes $next; edit the version first for a minor or major release."
          else
            echo "::notice::a prepare PR for $next is already open"
          fi

          for attempt in 1 2 3 4 5; do
            if gh pr merge "$branch" --squash --delete-branch; then
              exit 0
            fi
            echo "::warning::auto-merge attempt $attempt failed; retrying"
            sleep 5
          done
          echo "::warning::could not auto-merge $branch -- merge the prepare PR manually"
