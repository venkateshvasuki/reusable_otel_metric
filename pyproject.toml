[project]
name = "otel-metrics"
version = "0.2.0"
description = "Reusable OpenTelemetry metrics and tracing library with simplified instrument wrappers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vasuki Venkatesh" }]
keywords = [
    "opentelemetry",
    "otel",
    "otlp",
    "metrics",
    "tracing",
    "observability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.1.0",
    "opentelemetry-api>=1.20,<2.0",
    "opentelemetry-sdk>=1.20,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20,<2.0",
    "opentelemetry-instrumentation>=0.40b0",
]

[project.urls]
Homepage = "https://github.com/venkateshvasuki/reusable_otel_metric"
Repository = "https://github.com/venkateshvasuki/reusable_otel_metric"
Issues = "https://github.com/venkateshvasuki/reusable_otel_metric/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["otel_metrics"]

[tool.hatch.build.targets.sdist]
include = ["otel_metrics", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
